<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dynamic Background Grid & Elements -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Animated Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="120" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="220;170;220" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Network / Sync Nodes Animation in Background -->
  <g opacity="0.25">
    <line x1="100" y1="220" x2="250" y2="240" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="60" x2="1100" y2="100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="100" cy="220" r="6" fill="#38bdf8"/>
    <circle cx="250" cy="240" r="8" fill="#818cf8"/>
    <circle cx="950" cy="60" r="7" fill="#c084fc"/>
    <circle cx="1100" cy="100" r="5" fill="#f43f5e"/>
  </g>

  <!-- FOREGROUND TEXT (CLEAR & UNHIDDEN) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="420" y="38" width="360" height="32" rx="16" fill="url(#accent-grad)" opacity="0.9"/>
    <text x="600" y="59" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">
      SHOPPING &amp; MULTICHANNEL COMMERCE
    </text>

    <!-- Main Title -->
    <text x="600" y="130" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Marketplace Integration Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
      Curated List of Marketplace Connectors, Feed Management, PIM, ERP &amp; OMS Software
    </text>

    <!-- Feature Tags -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      <text x="600" y="225">
        🛍️ Amazon • eBay • Walmart • Etsy • Google Shopping | ☁️ SaaS &amp; 🌍 Open-Source
      </text>
    </g>
  </g>
</svg>
